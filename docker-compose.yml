version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: tenant-rag-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=tenantrag
      - POSTGRES_USER=tenantrag_dev
      - POSTGRES_PASSWORD=tenantrag_dev_insecure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantrag_dev -d tenantrag"]
      interval: 5s
      timeout: 3s
      retries: 5

  tenant-rag:
    build: .
    container_name: tenant-rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://tenantrag_dev:tenantrag_dev_insecure@postgres:5432/tenantrag
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/home/appuser/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # --- Optional: Enable GPU for local models ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:

