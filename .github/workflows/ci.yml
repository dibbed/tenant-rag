# Verification Pipeline: the Security Verification Pipeline feature
# (REQ-MTS-CI-001 to REQ-MTS-CI-005).
# Documentation: docs/features/security-verification-pipeline/README.md
#
# Blocking Checks (required status checks of main):
#   Tests (Python 3.10), Tests (Python 3.11), Tests (Python 3.12)
#   Security Regression Suite (Python 3.10), (Python 3.11), (Python 3.12)
#   PostgreSQL Verification
#   Static Analysis (ruff, blocking), (mypy, blocking), (bandit, blocking)
#   Dependency Vulnerability Check (includes lock drift validation)
#   Container Build Check
#   Verification Summary
# Report-Only Checks (visible, do not block a merge):
#   Optional Extra Audit (<extra>)
name: Verification Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CUDA_VISIBLE_DEVICES: ""
  TORCH_DEVICE: "cpu"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  REPORTS_DIR: verification-reports
  UV_VERSION: "0.12.19"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked test environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra test --python "${{ matrix.python-version }}"
      - name: Run the full test suite
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
        run: >-
          .venv/bin/python scripts/verification/run_suite.py full
          --report "$REPORTS_DIR/tests-py${{ matrix.python-version }}.json"
          -- -v
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-tests-py${{ matrix.python-version }}
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  security-suite:
    name: Security Regression Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history holds the base commit, to compare its manifest.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked test environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra test --python "${{ matrix.python-version }}"
      - name: Run the Security Regression Suite
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          manifest=tests/security/suite_manifest.json
          base_args=()
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:$manifest" 2>/dev/null; then
            git show "$BASE_SHA:$manifest" > "$RUNNER_TEMP/base-manifest.json"
            base_args=(--base-manifest "$RUNNER_TEMP/base-manifest.json" --base-ref "${BASE_SHA:0:12}")
          fi
          .venv/bin/python scripts/verification/run_suite.py security \
            --report "$REPORTS_DIR/security-py${{ matrix.python-version }}.json" \
            "${base_args[@]}" -- -v
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-security-py${{ matrix.python-version }}
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  postgresql:
    name: PostgreSQL Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenantrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenantrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked test environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra test --python "3.12"
      - name: Upgrade a clean PostgreSQL database to Alembic head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tenantrag
        run: .venv/bin/python -m alembic upgrade head
      - name: Run real PostgreSQL isolation and auth verification
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tenantrag
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest tests/postgres/test_phase5_postgres.py -v --tb=short --no-cov
          status=$?
          STATUS="$status" .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = int(os.environ["STATUS"])
          report = {
              "check": "postgresql",
              "title": "PostgreSQL Verification",
              "mode": "blocking",
              "status": "pass" if status == 0 else "fail",
              "summary": (
                  "Alembic head plus real PostgreSQL RLS/auth verification passed"
                  if status == 0
                  else "Real PostgreSQL verification failed"
              ),
              "problems": [] if status == 0 else ["PostgreSQL pytest verification failed"],
          }
          path = Path(os.environ["REPORTS_DIR"]) / "postgresql.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY
          exit "$status"
      - name: Upload the PostgreSQL report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-postgresql
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  static-analysis:
    name: Static Analysis (${{ matrix.tool }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A Report-Only Check keeps the exit status of its tool: findings mark the
    # check as failed, and continue-on-error keeps them from failing the run.
    continue-on-error: ${{ matrix.mode == 'report-only' }}
    strategy:
      fail-fast: false
      matrix:
        # To make a check a Blocking Check, set its mode to "blocking" and add
        # "Static Analysis (<tool>, blocking)" to the required status checks.
        include:
          - tool: ruff
            mode: blocking
          - tool: mypy
            mode: blocking
          - tool: bandit
            mode: blocking
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked static-analysis environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --python "3.12"
      - name: Run ${{ matrix.tool }}
        run: >-
          .venv/bin/python scripts/verification/static_analysis.py ${{ matrix.tool }}
          --mode ${{ matrix.mode }}
          --report "$REPORTS_DIR/static-${{ matrix.tool }}.json"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-static-${{ matrix.tool }}
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11 (the Python version of the container image)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify dependency lock and install the locked default environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv export --frozen --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/requirements.txt"
          diff -u <(tail -n +3 requirements.txt) <(tail -n +3 "$RUNNER_TEMP/requirements.txt")
          uv sync --frozen --no-install-project --python "3.11"
      - name: Install pip-audit in its own virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install -r scripts/verification/requirements-audit.txt
      - name: Audit the installed dependencies
        run: >-
          python scripts/verification/dependency_audit.py run
          --pip-audit "$RUNNER_TEMP/pip-audit/bin/pip-audit"
          --python ".venv/bin/python"
          --report "$REPORTS_DIR/dependency-audit.json"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-dependency-audit
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  optional-extras-audit:
    name: Optional Extra Audit (${{ matrix.extra }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        extra: [dev, test, full, offline, ocr, ml, hf, vectorstores, docs]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Resolve and install the locked extra in isolation
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --no-install-project --extra "${{ matrix.extra }}" --python "3.11"
      - name: Install pip-audit in its own virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install -r scripts/verification/requirements-audit.txt
      - name: Audit optional extra (report-only)
        continue-on-error: true
        run: >-
          python scripts/verification/dependency_audit.py run
          --pip-audit "$RUNNER_TEMP/pip-audit/bin/pip-audit"
          --python ".venv/bin/python"
          --report "$REPORTS_DIR/optional-extra-${{ matrix.extra }}.json"
      - name: Tag the optional-extra report separately from the default gate
        if: always()
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          extra = os.environ["EXTRA"]
          path = Path(os.environ["REPORTS_DIR"]) / f"optional-extra-{extra}.json"
          if path.exists():
              report = json.loads(path.read_text(encoding="utf-8"))
              report["check"] = f"optional-extra-{extra}"
              report["title"] = f"Optional Extra Audit ({extra})"
              report["mode"] = "report-only"
              path.write_text(
                  json.dumps(report, indent=1, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-optional-extra-${{ matrix.extra }}
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Container Build Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build, start and verify the container
        run: >-
          python scripts/verification/container_check.py --build
          --image tenant-rag:verification
          --report "$REPORTS_DIR/container.json"
      - name: Remove the verification containers
        if: always()
        run: docker ps --all --quiet --filter label=tenant-rag-verification | xargs --no-run-if-empty docker rm --force
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-container
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Verification Summary
    if: always()
    needs: [tests, security-suite, postgresql, static-analysis, dependency-audit, optional-extras-audit, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download the check reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verification-*
          path: ${{ env.REPORTS_DIR }}
          merge-multiple: true
      - name: Write the Verification Summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python scripts/verification/summary.py
          --reports "$REPORTS_DIR"
          --needs-env NEEDS_JSON
          --python-versions 3.10,3.11,3.12
          --output "$RUNNER_TEMP/verification-summary.md"
