name: Phase 3.5 Lock Generation

on:
  push:
    branches: [phase3-5/security-hardening]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase3-5/security-hardening
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Generate reproducible lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.12.19
          uv lock
          uv export --frozen --no-emit-project --format requirements.txt --output-file requirements.txt
      - name: Commit generated lock and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt
          git rm .github/workflows/phase35-lockgen.yml
          git commit -m "Lock dependencies reproducibly"
          git push origin HEAD:phase3-5/security-hardening
